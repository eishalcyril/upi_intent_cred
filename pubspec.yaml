name: upi_intent_cred
description: "A patched fork of upi_intent with iOS CRED/Google Pay detection and Swift Package Manager support. Drop-in replacement with identical APIs."
version: 1.0.2
homepage: https://github.com/eishalcyril/upi_intent_cred
repository: https://github.com/eishalcyril/upi_intent_cred
issue_tracker: https://github.com/eishalcyril/upi_intent_cred/issues

topics:
  - upi
  - payments
  - fintech
  - india
  - flutter

screenshots:
  - description: "Built-in minimal app picker and Example App interface"
    path: screenshots/app_picker.png
environment:
  sdk: ^3.10.1
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.upiintent.upi_intent
        pluginClass: UpiIntentPlugin
      ios:
        pluginClass: UpiIntentPlugin
